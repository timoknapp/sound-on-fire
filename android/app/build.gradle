plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.example.sound_on_fire"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // ExpiredTargetSdkVersion is a Google Play rule; the app is sideloaded on FireTV (GitHub/AppCenter).
        disable 'InvalidPackage', 'ExpiredTargetSdkVersion'
    }

    defaultConfig {
        applicationId "com.example.sound_on_fire"
        minSdk flutter.minSdkVersion
        // Kept at 30 on purpose: raising it changes runtime behaviour (storage, package installs) for the in-app updater.
        targetSdk 30
        versionCode flutter.versionCode
        versionName flutter.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // MS App Center
    def appCenterSdkVersion = '5.0.6'
    implementation "com.microsoft.appcenter:appcenter-analytics:${appCenterSdkVersion}"
    implementation "com.microsoft.appcenter:appcenter-crashes:${appCenterSdkVersion}"
    implementation "com.microsoft.appcenter:appcenter-distribute:${appCenterSdkVersion}"
    // AppUpdater https://github.com/javiersantos/AppUpdater
    implementation 'com.github.MurtadhaS:AppUpdater:2.9'
}

configurations.all {
    resolutionStrategy {
        // AppUpdater 2.9 pulls prdownloader 0.6.0, which was only hosted on the shut-down JCenter.
        // 1.0.2 on JitPack ships the same com.downloader classes.
        dependencySubstitution {
            substitute module('com.mindorks.android:prdownloader') using module('com.github.amitshekhariitbhu:PRDownloader:1.0.2')
        }
        // Jetified support libs (AppUpdater) pull vectordrawable-animated 1.0.0, whose manifest reuses the
        // 'androidx.vectordrawable' namespace; AGP 8+ rejects that. 1.1.0+ has its own namespace.
        force 'androidx.vectordrawable:vectordrawable-animated:1.1.0'
    }
}
